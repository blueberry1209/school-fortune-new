<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 학교 생존력 테스트</title>
  <style>
    /* 페이지 전체 기본 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      /* 밝은 그라데이션 배경 (하늘색 → 연보라 → 연노랑) */
      background: linear-gradient(135deg, #c3f0ff 0%, #e8d5ff 50%, #fff4c4 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    /* 메인 카드 */
    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      color: #2d3748;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 28px;
    }

    /* 생존력 확인 버튼 */
    .btn-check {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
      max-width: 280px;
    }

    .btn-check:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(17, 153, 142, 0.45);
    }

    .btn-check:active {
      transform: translateY(0);
    }

    /* 결과 카드 (처음엔 숨김) */
    .result-card {
      margin-top: 24px;
      padding: 24px;
      background: linear-gradient(180deg, #f7fafc 0%, #edf2f7 100%);
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      text-align: left;
      /* 부드럽게 나타나는 애니메이션용 */
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      display: none;
    }

    /* 버튼 누른 뒤 보이게 할 때 붙이는 클래스 */
    .result-card.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .result-title {
      font-size: 1.05rem;
      color: #2d3748;
      font-weight: bold;
      text-align: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }

    .result-item {
      margin-bottom: 16px;
    }

    .result-item:last-child {
      margin-bottom: 0;
    }

    .result-label {
      font-size: 0.75rem;
      color: #11998e;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .result-text {
      font-size: 0.95rem;
      color: #2d3748;
      line-height: 1.5;
    }

    /* 발표 확률 숫자 강조 */
    .probability {
      font-size: 1.4rem;
      font-weight: bold;
      color: #e53e3e;
    }
  </style>
</head>
<body>
  <!-- 메인 카드 -->
  <div class="card">
    <h1>오늘의 학교 생존력 테스트</h1>
    <p class="subtitle">버튼 한 번으로 오늘의 학교 생존 스펙을 확인해 보세요.</p>

    <!-- 생존력 확인 버튼 -->
    <button type="button" class="btn-check" id="btnCheck">생존력 확인하기</button>

    <!-- 결과가 나올 카드 (처음엔 비어 있음) -->
    <div class="result-card" id="resultCard">
      <h2 class="result-title">오늘의 생존 결과</h2>
      <div class="result-item">
        <div class="result-label">오늘의 예측</div>
        <div class="result-text" id="predictText">-</div>
      </div>
      <div class="result-item">
        <div class="result-label">발표 걸릴 확률</div>
        <div class="result-text">
          <span class="probability" id="probabilityText">0</span>%
        </div>
      </div>
      <div class="result-item">
        <div class="result-label">생존 장비</div>
        <div class="result-text" id="gearText">-</div>
      </div>
      <div class="result-item">
        <div class="result-label">주의 구간</div>
        <div class="result-text" id="cautionText">-</div>
      </div>
      <div class="result-item">
        <div class="result-label">생존 팁</div>
        <div class="result-text" id="tipText">-</div>
      </div>
    </div>
  </div>

  <script>
    // ===== 학교 생활 관련 문구 목록 =====

    // 오늘의 예측 문구들
    const predictions = [
      "급식 메뉴가 의외로 괜찮을 가능성. 점심만큼은 기대해도 됨.",
      "조별 과제에서 말은 적어도 존재감은 챙기는 날.",
      "시험은 없지만 수행평가 언급 확률은 상시 상주.",
      "'잠깐만요' 한 마디가 오늘의 생존 키워드.",
      "쉬는 시간 10분이 10초처럼 느껴지는 타임라인.",
      "복도에서 담임과 마주쳐도 자연스럽게 인사하면 무사 통과.",
      "필기구 분실 없이 하루 종료 — 희귀 이벤트 발생 가능.",
      "모르는 문제는 '확인해 볼게요'가 통하는 커뮤니케이션 데이.",
      "체육 시간 체력 소모는 있지만 분위기는 나쁘지 않음.",
      "오답노트 한 페이지만 정리해도 성취감 버프."
    ];

    // 생존 장비 목록
    const survivalGear = [
      "0.5 샤프 + 여분 심",
      "충전 완료된 이어폰",
      "물티슈 (1장이면 충분)",
      "필통 속 에너지바",
      "창가 뒤쪽 자리",
      "만년필 (검은색)",
      "교과서 책갈피",
      "보조배터리",
      "편한 운동화",
      "쉬는 시간용 텀블러"
    ];

    // 주의 구간 목록
    const cautions = [
      "수업 중 스마트폰 각도 조절 실패 금지.",
      "복도 질주 시 담임 스폰 확률 급상승.",
      "시험지 앞뒤 확인 없이 제출하지 말 것.",
      "조별 과제에서 '나도 할게'만 남기고 잠수 금지.",
      "급식 줄 떠들다가 맨 뒤 번호표 받기 주의.",
      "친구에게 '이거 답 뭐야?'를 교실에서 크게 묻지 말 것.",
      "체육복 미지참 변명 전에 가방부터 확인.",
      "칠판 지우개 가루 옷에 묻히면 하루 종일 신경 쓰임."
    ];

    // 생존 팁 목록
    const survivalTips = [
      "모르는 문제는 일단 번호만 매기고 후반에 풀기.",
      "선생님 질문엔 1초 뒤에 시선 정면 + 짧은 답변.",
      "쉬는 시간 시작 3분 전에 화장실 가면 수업 중 편함.",
      "빌린 물건은 반납 전에 사진 한 장 — 분실 방지.",
      "급식은 1교시 끝나자마자 줄 서면 시간 아낌.",
      "발표는 속도보다 또박또박이 더 안전함.",
      "숙제는 점심 전에 1개만이라도 처리해 두기.",
      "출석 체크 자리는 교실 앞쪽이 유리한 경우가 많음."
    ];

    // ===== DOM 요소 가져오기 =====
    const btnCheck = document.getElementById("btnCheck");
    const resultCard = document.getElementById("resultCard");
    const predictText = document.getElementById("predictText");
    const probabilityText = document.getElementById("probabilityText");
    const gearText = document.getElementById("gearText");
    const cautionText = document.getElementById("cautionText");
    const tipText = document.getElementById("tipText");

    // 배열에서 랜덤으로 하나 골라주는 함수
    function pickRandom(array) {
      const index = Math.floor(Math.random() * array.length);
      return array[index];
    }

    // 1부터 100 사이 랜덤 숫자 만들기
    function randomPercent() {
      return Math.floor(Math.random() * 100) + 1;
    }

    // 버튼 클릭 시 실행
    btnCheck.addEventListener("click", function () {
      // 각 항목에 랜덤 값 넣기
      predictText.textContent = pickRandom(predictions);
      probabilityText.textContent = randomPercent();
      gearText.textContent = pickRandom(survivalGear);
      cautionText.textContent = pickRandom(cautions);
      tipText.textContent = pickRandom(survivalTips);

      // 결과 카드 부드럽게 보이기
      // 먼저 show 클래스를 빼서 애니메이션을 다시 시작할 수 있게 함
      resultCard.classList.remove("show");

      // 브라우저가 화면을 그린 뒤에 show를 붙여야 애니메이션이 잘 보임
      void resultCard.offsetWidth; // 강제로 한 번 다시 그리기 (reflow)

      resultCard.classList.add("show");
    });
  </script>
</body>
</html>
